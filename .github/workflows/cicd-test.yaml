# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Ejecutar pruebas y generar reporte
      run: |
        python -m pytest -v --cov=. --cov-report=html --html=report.html
        
    - name: Build Clase
      run: |
        mkdir -p build
        cp calculadora.py build/
        
    - name: Build Reporte COV
      run: |
        cp -r htmlcov build/ || true
        
    - name: Build Reporte HTML
      run: |
        cp -r report.html build/ || true
        
    - name: Build Artefacto ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Artefacto-Probado
        path: build/
